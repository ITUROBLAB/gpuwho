name: release

# Push a tag to cut a release:
#   make deb            # sanity-check locally first
#   git tag -a v0.1.1 -m 'prune and log size warning'
#   git push origin v0.1.1
#
# The tag must match the VERSION in the Makefile; the build fails loudly if it
# does not, rather than publishing a .deb whose filename lies about its version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    # glibc symbol versioning is forward-compatible only: a binary linked
    # against an older glibc runs fine on newer systems, never the reverse.
    # Building on the 24.04 host directly binds the binary to 24.04's glibc
    # and it then refuses to start on 22.04 or 20.04 ("GLIBC_2.38 not
    # found"). Building inside a 20.04 container instead gives one .deb that
    # runs on 20.04 through 24.04, so there is no need for a build matrix.
    container: ubuntu:20.04
    steps:
      # The container has neither git nor a CA bundle, both of which
      # actions/checkout needs; install them before it runs. Nothing here is
      # sudo'd because container steps already run as root.
      - name: Install checkout prerequisites
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install build tools
        run: |
          set -eux
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential wget gnupg fakeroot man-db

      # The container has no NVIDIA driver, so there is no libnvidia-ml.so.1
      # and no nvml.h.  cuda-nvml-dev ships both the header and a stub
      # library that records the right SONAME, which is all the link needs:
      # the real library is resolved on the target machine at run time.
      - name: Install NVML headers and stub
        run: |
          set -eux
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.1-1_all.deb
          dpkg -i cuda-keyring_1.1-1_all.deb
          apt-get update
          apt-get install -y --no-install-recommends cuda-nvml-dev-12-8
          test -f /usr/local/cuda-12.8/include/nvml.h
          test -f /usr/local/cuda-12.8/lib64/stubs/libnvidia-ml.so

      # gpuwho records a DT_NEEDED on libnvidia-ml.so.1, which normally comes
      # from the installed driver.  A runner has no driver, so without this the
      # binary cannot start at all -- not even `gpuwho --version`, which never
      # calls NVML -- and every test fails with empty output.
      #
      # The CUDA stub exports the same SONAME, so it satisfies the loader.  Its
      # entry points do not talk to a GPU, which is fine: CI only exercises
      # report, prune and --version.  Anything that really calls NVML still
      # fails, and the test suite skips those cases on its own.
      - name: Satisfy the NVML SONAME (the runner has no driver)
        run: |
          set -eux
          objdump -p /usr/local/cuda-12.8/lib64/stubs/libnvidia-ml.so \
            | grep -qE 'SONAME +libnvidia-ml\.so\.1'
          ln -sf /usr/local/cuda-12.8/lib64/stubs/libnvidia-ml.so \
                 /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
          ldconfig
          ldconfig -p | grep libnvidia-ml

      - name: Check the tag matches the Makefile VERSION
        run: |
          set -eu
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          makefile_version=$(make -s printversion CUDA_HOME=/usr/local/cuda-12.8)
          echo "tag=$tag makefile=$makefile_version"
          if [ "$tag" != "v$makefile_version" ]; then
            echo "::error::tag $tag does not match Makefile VERSION $makefile_version"
            echo "Bump VERSION in the Makefile, or retag."
            exit 1
          fi
          echo "PKG_VERSION=$makefile_version" >> "$GITHUB_ENV"

      - name: Show what the build found
        run: make config CUDA_HOME=/usr/local/cuda-12.8

      - name: Build
        run: make CUDA_HOME=/usr/local/cuda-12.8

      # The test suite drives report against synthetic logs, so it runs fine
      # with no GPU; the GPU-dependent cases skip themselves.
      - name: Test
        run: make test CUDA_HOME=/usr/local/cuda-12.8

      - name: Build the .deb
        run: make deb CUDA_HOME=/usr/local/cuda-12.8

      - name: Verify the package
        run: |
          set -eux
          deb=$(ls gpuwho_*_*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb -c "$deb"
          # Installing must not need a driver present.
          apt-get install -y "./$deb"
          gpuwho --version
          man -w gpuwho
          test -f /etc/gpuwho/ignore.conf
          systemctl is-enabled gpuwho-collect.timer || true
          apt-get purge -y gpuwho

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: gpuwho_*_*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            ```sh
            sudo apt install ./gpuwho_${{ env.PKG_VERSION }}_amd64.deb
            gpuwho report --day
            ```

            Installing enables NVIDIA accounting mode, starts the collector
            timer, and primes the state directory, so reports work immediately.

            Requires an installed NVIDIA driver, which provides
            `libnvidia-ml.so.1` at run time.  Built against the CUDA 12.8 NVML
            stub, so it links against whatever driver version is on the target.
