# /etc/gpuwho/ignore.conf -- compute processes that should not count as jobs.
#
# This file ships EMPTY on purpose.  Nothing is filtered until you say so, so
# no one's GPU time is ever silently dropped from a report.
#
# You almost certainly do not need this file.  gpuwho lists only *compute*
# contexts, because that is all NVML's compute process list returns.  Xorg, the
# compositor, plasmashell, browsers and the rest of a desktop session hold
# graphics-only contexts (G in nvidia-smi) and never appear here at all.
#
# What this file is for is the other case: a process that genuinely holds a
# compute context (C or C+G in nvidia-smi) but that you do not consider a job
# on this machine -- a desktop streaming host, a video encoder, a service
# account.  That is local policy, which is why it is a config file.
#
# Rule syntax, one per line.  Blank lines and lines starting with # are ignored.
#
#   <glob>        matches the command basename OR the full command line
#                   sunshine        -> /usr/bin/sunshine
#                   *ffmpeg*        -> anything with ffmpeg in its command line
#   cmd:<glob>    matches the full command line only
#   user:<glob>   matches the owner's name
#   uid:<n>       matches the owner's uid exactly
#
# Rules apply to both the snapshot and the recorded history.  Run
# `gpuwho --no-ignore` at any time to see every compute process regardless.
#
# A process that is already being tracked is never dropped mid-run by a rule
# change: filtering decides whether to *start* tracking, so intervals always
# close cleanly.
#
# Examples -- uncomment to use:
#
# sunshine
# obs
# cmd:*/nvidia-persistenced
# user:gdm
